name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    # Nightly: catch drift in the live API even when nothing here changes.
    - cron: "37 5 * * *"
  workflow_dispatch:

jobs:
  test:
    name: Unit Tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install .[dev]

    - name: Run unit tests
      run: |
        pytest -v -m "not integration"

  integration:
    name: Live Integration Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install .[dev]

    - name: Run integration tests against live API
      run: |
        pytest -v -m "integration"

    - name: Open an issue when the nightly run finds the live API incompatible
      if: failure() && github.event_name == 'schedule'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        title="Live Railworks API incompatible with pyrailworks"
        if [ -z "$(gh issue list --state open --search "$title in:title" --json number --jq '.[].number')" ]; then
          gh issue create --title "$title" --label needs-triage \
            --body "The nightly integration run against https://railworks.paddez.com failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        fi
