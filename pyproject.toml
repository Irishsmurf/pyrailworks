[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyrailworks"
version = "0.1.0"
description = "Python client library for the Public RO Railworks Irish Rail Engineering Works API"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Irishsmurf" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.24.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
